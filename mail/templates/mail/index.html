{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Service</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'mail/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="email-container">
            <div class="email-header">
                <h1 class="mb-0"><i class="fas fa-paper-plane me-3"></i>Email Service</h1>
                <p class="mb-0 mt-2">Send emails quickly and easily</p>
            </div>
            
            <div class="email-body">
                <form id="emailForm" method="post">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="recipient" class="form-label">To:</label>
                        <div class="recipients-area">
                            <div class="chip">
                                example@gmail.com
                                <span class="close">&times;</span>
                            </div>
                            <input type="email" class="form-control border-0" id="recipient" name="recipient" placeholder="Add recipient...">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="subj" class="form-label">Subject</label>
                        <input type="text" class="form-control" id="subj" name="subj" placeholder="Enter email subject">
                    </div>
                    
                    <div class="mb-4">
                        <label for="msg" class="form-label">Message</label>
                        <textarea class="form-control" id="msg" name="msg" placeholder="Type your message here..."></textarea>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
   
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane me-2"></i>Send Email
                        </button>
                    </div>
                </form>
                {% if status %}
                    <div class="alert alert-success mt-4 text-center" role="alert">
                        {{ status }}
                    </div>
                {% endif %}
            </div>
            
            <div class="email-footer">
                <div class="icon-text justify-content-center">
                    <i class="fas fa-shield-alt"></i>
                    <span>Your emails are secure and encrypted</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
   
</body>
</html>
